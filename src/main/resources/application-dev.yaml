spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/omnihealth_platform?options=-c%20TimeZone=UTC
    username: postgres
    password: utkarsh

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/platform/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    from-email: "OmniHealth Dev <noreply@utkarshdev.me>"
  tenant:
    admin:
      url: ${spring.datasource.url}
      username: ${spring.datasource.username}
      password: ${spring.datasource.password}
    connection:
      host: 127.0.0.1
      port: 5432
      username: ${spring.datasource.username}
      password: ${spring.datasource.password}
      schema: public
      max-pool-size: 5
    flyway:
      locations: classpath:db/tenant/migration
      baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE