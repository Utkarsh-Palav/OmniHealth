services:
  postgres:
    image: postgres:17
    container_name: omnihealth-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: omnihealth_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d omnihealth" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: